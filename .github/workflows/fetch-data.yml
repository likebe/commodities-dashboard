name: Fetch commodity data

on:
  schedule:
    # GitHub cron is UTC. 11:30 UTC ≈ 07:30 US-Eastern (EDT) — runs before the 8am dashboard build.
    - cron: '30 11 * * *'
    # second refresh mid-session
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch real daily prices -> data.json
        run: python scripts/fetch_commodities.py

      - name: Commit data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No change in data.json"
          else
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git push
          fi
