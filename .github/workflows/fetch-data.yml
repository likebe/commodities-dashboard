name: Fetch commodity data

on:
  schedule:
    - cron: '30 11 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch real daily prices -> data.json (capture log)
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          set +e
          python scripts/fetch_commodities.py 2>&1 | tee fetch.log
          echo "exit_code=${PIPESTATUS[0]}" | tee -a fetch.log
          echo "run_utc=$(date -u +%FT%TZ)" >> fetch.log

      - name: Commit data.json + fetch.log if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json fetch.log
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git push
          fi
