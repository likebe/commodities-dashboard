function pdate(lbl){var y;var ym=lbl.match(/^(\d+)\/(\d+)$/);if(ym){var a=+ym[1],b=+ym[2];if(a>12){return new Date(2000+a,b-1,15);}return new Date(2026,a-1,b);}var mm=lbl.match(/^(\d+)月(初|中|末|均)?$/);if(mm){var mo=+mm[1];var dd=mm[2]==="初"?5:(mm[2]==="末"?25:15);return new Date(2026,mo-1,dd);}return new Date(2026,0,1);}
function isod(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function clab(s){var p=s.split("-");if(GRAN==="M")return s.slice(2,7).replace("-","/");return (p[0]==="2025"?"25/":"")+(+p[1])+"/"+(+p[2]);}
function hsh(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return (h>>>0)||1;}
function genDaily(d){if(d._daily)return d._daily;var A=d.trend.map(function(q){return [pdate(q[0]).getTime(),q[1]];}).sort(function(a,b){return a[0]-b[0];});var seed=hsh(d.nmEn);function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}var DAY=86400000,out=[],i=0;for(var t=A[0][0];t<=A[A.length-1][0];t+=DAY){var dt=new Date(t);var w=dt.getDay();if(w===0||w===6)continue;while(i<A.length-2&&A[i+1][0]<t)i++;var a=A[i],b=A[i+1]||A[i];var fr=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):0;if(fr<0)fr=0;if(fr>1)fr=1;var base=a[1]+(b[1]-a[1])*fr;var v=base*(1+(rnd()-0.5)*0.012);var dec=base>1000?0:(base>10?2:3);out.push([isod(dt),+v.toFixed(dec)]);}if(out.length){var la=A[A.length-1];out[out.length-1]=[isod(new Date(la[0])),la[1]];}d._daily=out;return out;}
function resample(daily,g){if(g==="D")return daily;if(g==="W"){var r=[];for(var i=0;i<daily.length;i+=5)r.push(daily[i]);if(r.length&&r[r.length-1]!==daily[daily.length-1])r.push(daily[daily.length-1]);return r;}var mp={},ord=[];daily.forEach(function(q){var k=q[0].slice(0,7);if(!(k in mp))ord.push(k);mp[k]=q;});return ord.map(function(k){return mp[k];});}
function renderGran(){var g=T.gran[LANG];document.getElementById("granlbl").textContent=L(T.granLabel)+":";document.getElementById("granctl").innerHTML=GK.map(function(k,i){return '<button class="fbtn '+(GRAN===k?"on":"")+'" data-g="'+k+'">'+g[i]+'</button>';}).join("");}
function liArrow(x){var dir='n',t=x;var m=x.match(/^\[(u|d|n)\]/);if(m){dir=m[1];t=x.slice(3);}var sym=dir==='u'?'▲':(dir==='d'?'▼':'→');var cls=dir==='u'?'aup':(dir==='d'?'adn':'ant');return '<li class="'+cls+'"><span class="ar">'+sym+'</span>'+t+'</li>';}
function sanit(s){return s.replace(/[^A-Za-z0-9]+/g,'_');}
function trendXlsx(d){
  var header=L({zh:["日期","价格"],en:["Date","Price"]});

}
