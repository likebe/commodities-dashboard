function pdate(lbl){var y;var ym=lbl.match(/^(\d+)\/(\d+)$/);if(ym){var a=+ym[1],b=+ym[2];if(a>12){return new Date(2000+a,b-1,15);}return new Date(2026,a-1,b);}var mm=lbl.match(/^(\d+)月(初|中|末|均)?$/);if(mm){var mo=+mm[1];var dd=mm[2]==="初"?5:(mm[2]==="末"?25:15);return new Date(2026,mo-1,dd);}return new Date(2026,0,1);}
function isod(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function clab(s){var p=s.split("-");if(GRAN==="M")return s.slice(2,7).replace("-","/");return (p[0]==="2025"?"25/":"")+(+p[1])+"/"+(+p[2]);}
function hsh(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return (h>>>0)||1;}
function genDaily(d){if(d._daily)return d._daily;var A=d.trend.map(function(q){return [pdate(q[0]).getTime(),q[1]];}).sort(function(a,b){return a[0]-b[0];});var seed=hsh(d.nmEn);function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}var DAY=86400000,out=[],i=0;for(var t=A[0][0];t<=A[A.length-1][0];t+=DAY){var dt=new Date(t);var w=dt.getDay();if(w===0||w===6)continue;while(i<A.length-2&&A[i+1][0]<t)i++;var a=A[i],b=A[i+1]||A[i];var fr=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):0;if(fr<0)fr=0;if(fr>1)fr=1;var base=a[1]+(b[1]-a[1])*fr;var v=base*(1+(rnd()-0.5)*0.012);var dec=base>1000?0:(base>10?2:3);out.push([isod(dt),+v.toFixed(dec)]);}if(out.length){var la=A[A.length-1];out[out.length-1]=[isod(new Date(la[0])),la[1]];}d._daily=out;return out;}
function resample(daily,g){if(g==="D")return daily;if(g==="W"){var r=[];for(var i=0;i<daily.length;i+=5)r.push(daily[i]);if(r.length&&r[r.length-1]!==daily[daily.length-1])r.push(daily[daily.length-1]);return r;}var mp={},ord=[];daily.forEach(function(q){var k=q[0].slice(0,7);if(!(k in mp))ord.push(k);mp[k]=q;});return ord.map(function(k){return mp[k];});}

    var sws=XLSX.utils.aoa_to_sheet([shdr].concat(sbody));sws['!cols']=[{wch:16},{wch:18},{wch:24},{wch:48}];
    XLSX.utils.book_append_sheet(wb,sws,L({zh:"数据来源",en:"Sources"}));
    XLSX.writeFile(wb,"commodities_all_daily_"+dt+".xlsx");
  }else{
    var hdr=[L({zh:"板块",en:"Sector"}),L({zh:"品种",en:"Instrument"}),L({zh:"合约",en:"Contract"}),L({zh:"日期",en:"Date"}),L({zh:"价格",en:"Price"}),L({zh:"数据来源",en:"Data source"}),L({zh:"来源链接",en:"Source URL"})];
    var csv=String.fromCharCode(0xFEFF)+hdr.join(",")+"\n";
    rows.forEach(function(d){var s=DSRC[d.nmEn]||["",""];genDaily(d).forEach(function(p){csv+=[L(SECNAME[d.sec]),LANG==='zh'?d.nm:d.nmEn,d.en,p[0],p[1],s[0],s[1]].map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",")+"\n";});});
    var b=new Blob([csv],{type:"text/csv;charset=utf-8;"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="commodities_all_daily_"+dt+".csv";document.body.appendChild(a);a.click();a.remove();
  }
}
document.getElementById('ovdl').addEventListener('click',exportOv);

// ---- Cards ----
function card(d){
  var nm=LANG==='zh'?d.nm:d.nmEn;var px=LANG==='zh'?d.px:d.pxEn;
  var drv=LANG==='zh'?d.drv:d.drvEn;var news=LANG==='zh'?d.news:d.newsEn;var cat=LANG==='zh'?d.cat:d.catEn;
  var el=document.createElement('div');el.className='card';
  el.innerHTML='<div class="head"><div class="nm">'+nm+'<span class="en">'+d.en+'</span></div><div class="px">'+px+' <small>'+L(T.asof)+d.asof+'</small></div></div>'
   +'<div class="chgrow"><span><b>'+L(T.wk)+'</b> '+pct(d.w)+'</span><span><b>'+L(T.mo)+'</b> '+pct(d.m)+'</span><span><b>'+d.yl+'</b> '+pct(d.y)+'</span></div>'
   +'<div class="cardbar"><button class="minidl">'+L(T.dlData)+'</button></div>'
   +'<div class="spark"><canvas></canvas></div>'
   +'<div class="blk"><div class="t">'+L(T.drv)+'</div><ul>'+drv.map(liArrow).join('')+'</ul></div>'
   +'<div class="blk"><div class="t">'+L(T.nws)+'</div><ul>'+news.map(liArrow).join('')+'</ul></div>'
   +'<div class="blk cat"><div class="t">'+L(T.cat)+'</div><ul>'+cat.map(liArrow).join('')+'</ul></div>';
  document.getElementById('sec-'+d.sec).appendChild(el);
  el.querySelector('.minidl').onclick=function(){trendXlsx(d);};
  var series=resample(genDaily(d),GRAN);var labels=series.map(function(p){return clab(p[0]);});var vals=series.map(function(p){return p[1];});var col=vals[vals.length-1]>=vals[0]?C.up:C.down;var pr=GRAN==="D"?0:2;
  new Chart(el.querySelector('canvas'),{type:'line',data:{labels:labels,datasets:[{data:vals,borderColor:col,backgroundColor:col+'22',fill:true,tension:GRAN==='D'?.15:.3,pointRadius:pr,pointBackgroundColor:col,borderWidth:GRAN==='D'?1.5:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{ticks:{color:C.muted,font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:7},grid:{display:false}},y:{ticks:{color:C.muted,font:{size:9}},grid:{color:C.grid}}}}});
}
function renderCards(){["energy","metals","ferrous","ags"].forEach(function(s){document.getElementById('sec-'+s).innerHTML='';});DATA.forEach(card);}

// ---- Views ----
function renderViews(){var H=T.viewsHead[LANG];
  var h='<table><thead><tr><th>'+H[0]+'</th><th>'+H[1]+'</th><th>'+H[2]+'</th><th>'+H[3]+'</th><th>'+H[4]+'</th></tr></thead><tbody>';
  VIEWS.forEach(function(v){h+='<tr><td>'+v.h+'</td><td>'+L(v.d)+'</td><td>'+L(v.inst)+'</td><td>'+L(v.tg)+'</td><td>'+L(v.c)+'</td></tr>';});
  h+='</tbody></table>';document.getElementById('viewswrap').innerHTML=h;}

// ---- Flows ----
function renderFlows(){
  document.getElementById('flowsgrid').innerHTML=FLOWS.map(function(f){
    var h='<div class="card"><div class="nm">'+L(f.t)+'</div><div class="blk"><ul>'+f.items.map(function(it){return '<li class="ant"><span class="ar">→</span>'+L(it)+'</li>';}).join('')+'</ul></div>';
    if(f.interp){h+='<div class="blk cat"><div class="t">'+L({zh:"解读",en:"Read"})+'</div><ul><li class="ant"><span class="ar">→</span>'+L(f.interp)+'</li></ul></div>';}
    return h+'</div>';
  }).join('');
}

// ---- Macro / Themes ----
function renderMacro(){document.getElementById('macrobar').innerHTML=MACRO.map(function(m){return '<div class="macro"><div class="k">'+L(m.k)+'</div><div class="v">'+m.v+'</div><div class="d">'+L(m.d)+'</div></div>';}).join('');}
function renderThemes(){document.getElementById('themegrid').innerHTML=THEME.map(function(t){return '<div class="card"><div class="nm">'+L(t.t)+'</div><div class="blk"><ul>'+t.items.map(function(it){return '<li class="ant"><span class="ar">→</span>'+L(it)+'</li>';}).join('')+'</ul></div></div>';}).join('');}

// ---- Calendar ----
function renderCal(){document.getElementById('cal').innerHTML=CAL.map(function(c){return '<div class="titem '+c[1]+'"><div class="date">'+L(c[0])+'</div><div class="body"><div class="ev">'+L(c[2])+' '+L(c[3]).split('/').map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div><div class="why">'+L(c[4])+'</div></div></div>';}).join('');}

  document.getElementById('h-ferrous').textContent=L(st.ferrous);

  document.getElementById('h-views').textContent=L(st.views);
  document.getElementById('h-flows').textContent=L(st.flows);

// ---- Prune empty sections (sections with no included instruments are fully hidden) ----
function pruneEmptySections(){
  ["energy","metals","ferrous","ags"].forEach(function(s){
    var grid=document.getElementById('sec-'+s);if(!grid)return;
    var empty=grid.children.length===0;var disp=empty?'none':'';
    grid.style.display=disp;
    var h=document.getElementById('h-'+s);if(h)h.style.display=disp;
    var nav=document.querySelector('#nav a[href="#h-'+s+'"]');if(nav)nav.style.display=disp;
    var fb=document.querySelector('#ovfilters .fbtn[data-f="'+s+'"]');if(fb)fb.style.display=disp;
    if(s==="energy"){var al=document.getElementById('arlegend');if(al)al.style.display=disp;}
  });
}
function applyLang(){
  document.body.dataset.lang=LANG;
  document.documentElement.lang=(LANG==='zh'?'zh-CN':'en');
  document.getElementById('langbtn').textContent=(LANG==='zh'?'EN':'中文');
  renderStatics();renderMacro();renderThemes();renderOv();renderGran();renderCards();renderViews();renderFlows();renderCal();
  pruneEmptySections();
}
// ---- Live data: pull real daily closes from data.json (built daily by GitHub Action); fall back to baked values ----
function mergeLiveData(cb){
  if(!window.fetch){cb();return;}
  fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.instruments){var n=0,asof='';
      DATA.forEach(function(d){var o=j.instruments[d.nmEn];if(!o)return;
        if(o.px){d.px=o.px;d.pxEn=o.pxEn||o.px;}
        if(o.asof){d.asof=o.asof;asof=o.asof;}
        if(typeof o.w==='number')d.w=o.w;
        if(typeof o.m==='number')d.m=o.m;
        if(typeof o.y==='number')d.y=o.y;
        if(o.yl)d.yl=o.yl;
        if(o.series&&o.series.length){d._daily=o.series.map(function(p){return [p[0],p[1]];});}
        d._live=true;n++;});
      if(n)window.__live={n:n,asof:asof,updated:j.updated};
    }
    cb();
  }).catch(function(){cb();});
}
function boot(){
  applyLang();
  var v=window.__live;
  if(v&&v.n){var t=document.getElementById('htime');if(t){t.innerHTML+=(LANG==='zh'
    ?' · <b style="color:var(--up)">● 实时</b> '+v.n+' 品种价格/走势取自 FRED/Stooq（截至 '+v.asof+'）'
    :' · <b style="color:var(--up)">● Live</b> '+v.n+' instruments via FRED/Stooq (as of '+v.asof+')');}}
}
document.getElementById('langbtn').addEventListener('click',function(){LANG=(LANG==='zh'?'en':'zh');boot();});
mergeLiveData(boot);
</script>
