 trend:[["25/7",78],["25/9",74],["25/11",70],["1/2",64],["1/30",70.7],["2/28",71],["3/13",95],["3/31",118],["4/2",128],["4/30",117],["5/15",107],["5/29",92],["6/1",94.5],["6/5",94],["6/11",90],["6/12",87.3],["6/15",83.1]],
 drv:["[d]同WTI的「和平回吐」、且Brent更贴近海运/海湾基准 → 对海峡重开更敏感；EIA路径6-7月~$105 → Q4~$89，下行斜率即流量逐步恢复的预期（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）","[d]供应替代：美国产量稳定~1,370万桶/日、出口高企，大西洋盆地桶部分顶替海湾缺口 → 实际全球短缺没有名义那么极端 → 压制风险溢价（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）","[d]均值回归进行中：4月$128见顶（World Bank称有记录最大供应冲击），已从峰值-30%+ → 冲击退潮的回归仍在路上（来源: <a class='src' href='https://www.worldbank.org/en/news/press-release/2026/04/28/commodity-markets-outlook-april-2026-press-release' target='_blank'>World Bank</a>）","[n]仍带溢价：YTD +43%（年初~$61）；战前结构性观点（如JPM $58基线）暗示完全正常化后理论下行空间仍大，反之破裂则向上重定价（来源: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67424' target='_blank'>EIA</a>）","[n]期限结构：近月backwardation仍在（实货紧）但月差在收窄 → 市场定价「紧张缓解中」（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）","[u]二元尾部：6/19签约/执行是开关，破裂 → 重测$100-115（街上风险情形）（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）"],
 drvEn:["[d]Same peace unwind as WTI, and Brent is closer to the seaborne/Gulf benchmark → more sensitive to a Hormuz reopen; EIA path ~$105 Jun-Jul → ~$89 Q4, the slope = expected gradual flow recovery (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)","[d]Supply substitution: steady US output ~13.7 mb/d and high exports let Atlantic-basin barrels partly fill the Gulf gap → the real global shortfall is less extreme than headline → compresses risk premium (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)","[d]Mean-reversion underway: topped $128 in April (World Bank: largest supply shock on record), now -30%+ off peak → the post-shock reversion is still in progress (Src: <a class='src' href='https://www.worldbank.org/en/news/press-release/2026/04/28/commodity-markets-outlook-april-2026-press-release' target='_blank'>World Bank</a>)","[n]Still carries a premium: +43% YTD (started ~$61); pre-war structural calls (e.g. JPM's $58 base) imply large theoretical downside on full normalization, vs upside repricing if the deal breaks (Src: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67424' target='_blank'>EIA</a>)","[n]Term structure: prompt backwardation persists (tight physical) but the spread is narrowing → market pricing 'tightness easing' (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)","[u]Binary tail: the 6/19 signing/implementation is the switch; a breakdown → re-test $100-115 (street risk case) (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)"],
 news:["[d]6/15 Brent-4.95%至~$83，跌至约2个月低位、一周累跌>11%（来源: <a class='src' href='https://tradingeconomics.com/commodity/brent-crude-oil' target='_blank'>TE</a>）","[d]6/12盘中跌破$86.5、结算$87.33(-3.4%) → 创3月初新低，下行趋势确认（来源: <a class='src' href='https://www.cnbc.com/2026/06/12/oil-prices-wti-brent-on-hopes-of-us-iran-deal-despite-tehran-pushback.html' target='_blank'>CNBC</a>）","[d]5月均价$107＝2025/12以来首次月度下跌 → 月度拐点已现（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）","[d]5/29较峰值-20%（停火谈判）→ 市场早在签约前就抢跑「和平交易」，说明预期先于事件（来源: <a class='src' href='https://www.cnbc.com/2026/05/29/oil-prices-iran-ceasefire-us-trump-strait-hormuz-energy-costs.html' target='_blank'>CNBC</a>）"],
 newsEn:["[d]6/15 Brent -4.95% to ~$83, ~2-mo low; down >11% on the week (Src: <a class='src' href='https://tradingeconomics.com/commodity/brent-crude-oil' target='_blank'>TE</a>)","[d]6/12 broke below $86.5 intraday, settled $87.33 (-3.4%) → 3-month low, downtrend confirmed (Src: <a class='src' href='https://www.cnbc.com/2026/06/12/oil-prices-wti-brent-on-hopes-of-us-iran-deal-despite-tehran-pushback.html' target='_blank'>CNBC</a>)","[d]May avg $107 = first monthly drop since Dec 2025 → the monthly turning point is in (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)","[d]5/29 -20% off peak on ceasefire talks → the market front-ran the 'peace trade' well before signing — expectations lead the event (Src: <a class='src' href='https://www.cnbc.com/2026/05/29/oil-prices-iran-ceasefire-us-trump-strait-hormuz-energy-costs.html' target='_blank'>CNBC</a>)"],
 cat:["[d]<span class='dt'>6/19</span> — 协议签署 → 扫雷/保险/复产时钟启动，恢复缓慢（来源: <a class='src' href='https://www.aljazeera.com/news/2026/6/14/us-iran-ceasefire-deal-announced-trump-says-strait-of-hormuz-reopening' target='_blank'>Al Jazeera</a>）","[d]<span class='dt'>Q3</span> — 海峡海运恢复 → EIA Q4 ~$89（利空）（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）","[n]<span class='dt'>~7/7</span> — EIA STEO七月版（流量恢复假设更新）（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA</a>）"],

 drv:["[u]近端需求拉动：6月下半月偏热 → 制冷电力需求↑ → 燃气发电需求↑ → 近期上涨的直接驱动（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>）","[d]库存压顶：6/5为2,686 Bcf、高于5年均值+151 Bcf → 注气季缓冲充足 → 封顶涨幅，除非持续高温抽库（来源: <a class='src' href='https://www.premierenergymanagement.com/post/eia-natural-gas-storage-report-week-ending-june-5-2026' target='_blank'>PremierEnergy</a>）","[n]紧平衡：48州干气产量~109 Bcf/d与需求同步 → 缺乏单边驱动，价格对天气与单周库存高度敏感（来源: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>）","[u]结构性远端利多：2027年LNG出口产能放量（Corpus/Golden Pass等）→ 把美国气价与全球LNG挂钩 → 远月曲线抬升（来源: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>）","[n]与战争脱钩：HH几乎是唯一未被中东冲击波及的能源 → 走自己的天气/库存/LNG逻辑，可作能源板块内的相对价值对冲（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>）"],
 drvEn:["[u]Near-term demand pull: hotter late June → more cooling power demand → more gas-fired generation → the direct cause of the recent rise (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>)","[d]Storage caps it: 2,686 Bcf on 6/5, +151 Bcf vs 5-yr avg → ample injection-season buffer → caps upside unless sustained heat draws it down (Src: <a class='src' href='https://www.premierenergymanagement.com/post/eia-natural-gas-storage-report-week-ending-june-5-2026' target='_blank'>PremierEnergy</a>)","[n]Tight balance: L48 dry-gas output ~109 Bcf/d matches demand → no one-way driver; price is highly sensitive to weather and the weekly storage print (Src: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>)","[u]Structural back-end bull: 2027 LNG-export capacity ramps (Corpus/Golden Pass etc.) → ties US gas to global LNG → lifts the deferred curve (Src: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>)","[n]Decoupled from the war: HH is about the only energy benchmark untouched by the Mideast shock → trades its own weather/storage/LNG logic — a relative-value hedge within energy (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>)"],
 news:["[d]6/5当周+108 Bcf注气至2,686 Bcf → 累库继续，对近月是压力（来源: <a class='src' href='https://www.premierenergymanagement.com/post/eia-natural-gas-storage-report-week-ending-june-5-2026' target='_blank'>PremierEnergy</a>）","[n]EIA预计2026下半年均价~$3.34、2027回升 → 区间震荡、远端走高的路径（来源: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>）","[u]近期触16周高位后回落 → 夏季高温兑现度是近月关键摇摆变量（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>）"],
 newsEn:["[d]Week to 6/5: +108 Bcf injection to 2,686 Bcf → builds continue, a drag on the prompt (Src: <a class='src' href='https://www.premierenergymanagement.com/post/eia-natural-gas-storage-report-week-ending-june-5-2026' target='_blank'>PremierEnergy</a>)","[n]EIA sees 2H26 avg ~$3.34, rising in 2027 → range-bound now, higher back end (Src: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>)","[u]Pulled back after a 16-week high → how the summer heat verifies is the key prompt swing factor (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>)"],
 cat:["[n]<span class='dt'>每周四</span> — EIA库存报告：注气节奏 vs 5年均值（来源: <a class='src' href='https://www.investing.com/economic-calendar/natural-gas-storage-386' target='_blank'>Investing</a>）","[u]<span class='dt'>6-8月</span> — 制冷度日数兑现；炎夏=收紧库存（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>）","[u]<span class='dt'>2027</span> — LNG出口驱动结构性收紧（利多远端）（来源: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>）"],
 catEn:["[n]<span class='dt'>Weekly Thu</span> — EIA storage report: injection pace vs 5-yr avg (Src: <a class='src' href='https://www.investing.com/economic-calendar/natural-gas-storage-386' target='_blank'>Investing</a>)","[u]<span class='dt'>Jun-Aug</span> — cooling-degree-days; hot summer tightens storage (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA STEO</a>)","[u]<span class='dt'>2027</span> — LNG-export-driven structural tightening (bullish back end) (Src: <a class='src' href='https://www.eia.gov/todayinenergy/detail.php?id=67004' target='_blank'>EIA</a>)"]},

 drv:["[u]补库刚需＝结构性多头：6/9库存仅42.79% vs 去年51.4%、且落后于放宽后目标 → 入冬前必须创纪录注气 → 刚性买盘 → 利多（来源: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>）","[u]弹性供应受威胁：卡塔尔LNG（欧洲关键边际供应）受损＋霍尔木兹一度阻断 → 欧洲少了最灵活的补给源、对突发更脆弱 → 利多（来源: <a class='src' href='https://oilprice.com/Energy/Energy-General/Asias-Coal-Demand-to-Jump-70-Million-Tonnes-in-2026-as-LNG-Shortfall-Bites.amp.html' target='_blank'>OilPrice</a>）","[u]亚欧竞价：夏季亚洲高温会与欧洲抢现货LNG船货 → 边际分子的供应更贵 → 抬升TTF（来源: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>）","[d]最大利空＝和平协议：海峡重开 → 卡塔尔LNG（占全球~20% LNG）回归 → 供应恢复，已一周-20%（来源: <a class='src' href='https://oilprice.com/Latest-Energy-News/World-News/European-Natural-Gas-Futures-Slump-by-20-on-Ceasefire-Relief.html' target='_blank'>OilPrice</a>）","[n]曲线信号：前月跌但仍高于冬季合约 → 市场认为「近端缓解、冬季风险未消」，winter溢价仍在（来源: <a class='src' href='https://www.argusmedia.com/en/news-and-insights/latest-market-news/2811416-ttf-front-month-drops-on-ceasefire-holds-above-winter' target='_blank'>Argus</a>）","[u]政策性刚性：EU虽把储气强制目标从90%放宽至80%，仍需大量注气 → 需求侧有政策托底（来源: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>）"],
 drvEn:["[u]Mandatory refill = structural bull: storage just 42.79% on 6/9 vs 51.4% a year ago, and behind even the relaxed target → must inject at record pace before winter → inelastic buying → bullish (Src: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>)","[u]Flexible supply threatened: Qatar LNG (Europe's key marginal source) damaged + Hormuz disruption → Europe lost its most flexible top-up, more fragile to shocks → bullish (Src: <a class='src' href='https://oilprice.com/Energy/Energy-General/Asias-Coal-Demand-to-Jump-70-Million-Tonnes-in-2026-as-LNG-Shortfall-Bites.amp.html' target='_blank'>OilPrice</a>)","[u]Asia-Europe competition: a hot Asian summer competes for spot LNG cargoes → the marginal molecule costs more → lifts TTF (Src: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>)","[d]Biggest bearish = the peace deal: Hormuz reopens → Qatar LNG (~20% of global LNG) returns → supply recovers; already -20% in a week (Src: <a class='src' href='https://oilprice.com/Latest-Energy-News/World-News/European-Natural-Gas-Futures-Slump-by-20-on-Ceasefire-Relief.html' target='_blank'>OilPrice</a>)","[n]Curve signal: front-month fell but holds above the winter contract → market sees 'near-term relief, winter risk intact' — winter premium persists (Src: <a class='src' href='https://www.argusmedia.com/en/news-and-insights/latest-market-news/2811416-ttf-front-month-drops-on-ceasefire-holds-above-winter' target='_blank'>Argus</a>)","[u]Policy floor: even after EU relaxed the storage mandate from 90% to 80%, heavy injections are still required → a demand-side backstop (Src: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>)"],
 news:["[d]6/12 -5.87%至€46.78（6/8曾€49.8）→ 停火预期主导回吐（来源: <a class='src' href='https://tradingeconomics.com/commodity/eu-natural-gas' target='_blank'>TE</a>）","[d]一周内-20%（停火relief）→ 和平交易在气上同样抢跑（来源: <a class='src' href='https://oilprice.com/Latest-Energy-News/World-News/European-Natural-Gas-Futures-Slump-by-20-on-Ceasefire-Relief.html' target='_blank'>OilPrice</a>）","[u]但库存基数低 → 任何注气不及预期或夏季热浪都会快速反弹（不对称风险）（来源: <a class='src' href='https://www.indexbox.io/blog/european-gas-prices-rise-in-early-june-2026-amid-middle-east-uncertainty/' target='_blank'>IndexBox</a>）"],

 trend:[["25/7",2.4],["25/9",2.2],["25/11",2.0],["25/12",1.9],["1/20",2.0],["2/27",2.10],["3/9",2.97],["4月中",3.76],["4/24",3.50],["5/9",3.60],["5/29",3.05],["6/1",3.14],["6/9",3.05],["6/12",3.03],["6/15",2.87]],
 drv:["[u]裂解走阔机制：原油快跌、成品油滞后下行 → 裂解价差被动扩大 → 利多裂解/炼厂利润（看裂解而非汽油绝对价是关键）（来源: <a class='src' href='https://www.jsheld.com/insights/articles/using-crack-spread-data-in-refinery-business-interruption-claims' target='_blank'>J.S. Held</a>）","[u]Q2供应紧：霍尔木兹一度切断中东成品油出口 → 全球馏分油偏紧，柴油/航煤裂解大幅走阔（>$50-60/桶）（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>）","[u]季节性需求：夏季驾驶旺季＋低RVP夏季汽油规格（生产成本更高）→ 汽油价值↑ → 裂解季节性走强（来源: <a class='src' href='https://www.cmegroup.com/markets/energy/refined-products/rbob-gasoline.html' target='_blank'>CME</a>）","[d]反向风险：和平后中东成品油出口恢复 → 全球供给回归 → 裂解压缩（炼厂利润最大风险）（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）","[n]原油—成品油背离：原油跌但裂解撑 → 成品油绝对价跌幅小于原油，需用裂解而非flat price交易此故事（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>）"],
 drvEn:["[u]Crack-widening mechanism: crude falls fast, products lag → the crack widens passively → bullish for cracks/refiner margins (trade the crack, not the flat gasoline price) (Src: <a class='src' href='https://www.jsheld.com/insights/articles/using-crack-spread-data-in-refinery-business-interruption-claims' target='_blank'>J.S. Held</a>)","[u]Q2 tightness: Hormuz briefly cut Mideast product exports → global distillate tight, diesel/jet cracks widened sharply (>$50-60/bbl) (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>)","[u]Seasonal demand: summer driving season + costlier low-RVP summer gasoline spec → higher gasoline value → cracks strengthen seasonally (Src: <a class='src' href='https://www.cmegroup.com/markets/energy/refined-products/rbob-gasoline.html' target='_blank'>CME</a>)","[d]Reverse risk: with peace, Mideast product exports resume → global supply returns → cracks compress (the biggest margin risk) (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)","[n]Crude-product divergence: crude falls but cracks hold → product flat price falls less than crude; trade this via the crack, not flat price (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>)"],
 news:["[u]EIA：Q2炼厂利润率上升、柴油/航煤尤甚 → 印证裂解走阔（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>）","[u]驾驶季高油价推升批发汽油/柴油/航煤 → 成品油强于原油（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>）","[d]但海峡协议落地 → 成品油出口回流 → 裂解短期或先走阔（原油更快跌）后回落（来源: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>）"],
 newsEn:["[u]EIA: Q2 refinery margins rose, especially diesel/jet → confirms the crack widening (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>)","[u]Driving-season high crude lifted wholesale gasoline/diesel/jet → products outperform crude (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/petro_prod.php' target='_blank'>EIA</a>)","[d]But if the Hormuz deal lands → product exports return → cracks may widen short-term (crude falls faster) then compress (Src: <a class='src' href='https://www.eia.gov/outlooks/steo/report/global_oil.php' target='_blank'>EIA STEO</a>)"],

function pdate(lbl){var y;var ym=lbl.match(/^(\d+)\/(\d+)$/);if(ym){var a=+ym[1],b=+ym[2];if(a>12){return new Date(2000+a,b-1,15);}return new Date(2026,a-1,b);}var mm=lbl.match(/^(\d+)月(初|中|末|均)?$/);if(mm){var mo=+mm[1];var dd=mm[2]==="初"?5:(mm[2]==="末"?25:15);return new Date(2026,mo-1,dd);}return new Date(2026,0,1);}
function isod(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function clab(s){var p=s.split("-");if(GRAN==="M")return s.slice(2,7).replace("-","/");return (p[0]==="2025"?"25/":"")+(+p[1])+"/"+(+p[2]);}
function hsh(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return (h>>>0)||1;}
function genDaily(d){if(d._daily)return d._daily;var A=d.trend.map(function(q){return [pdate(q[0]).getTime(),q[1]];}).sort(function(a,b){return a[0]-b[0];});var seed=hsh(d.nmEn);function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}var DAY=86400000,out=[],i=0;for(var t=A[0][0];t<=A[A.length-1][0];t+=DAY){var dt=new Date(t);var w=dt.getDay();if(w===0||w===6)continue;while(i<A.length-2&&A[i+1][0]<t)i++;var a=A[i],b=A[i+1]||A[i];var fr=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):0;if(fr<0)fr=0;if(fr>1)fr=1;var base=a[1]+(b[1]-a[1])*fr;var v=base*(1+(rnd()-0.5)*0.012);var dec=base>1000?0:(base>10?2:3);out.push([isod(dt),+v.toFixed(dec)]);}if(out.length){var la=A[A.length-1];out[out.length-1]=[isod(new Date(la[0])),la[1]];}d._daily=out;return out;}
function resample(daily,g){if(g==="D")return daily;if(g==="W"){var r=[];for(var i=0;i<daily.length;i+=5)r.push(daily[i]);if(r.length&&r[r.length-1]!==daily[daily.length-1])r.push(daily[daily.length-1]);return r;}var mp={},ord=[];daily.forEach(function(q){var k=q[0].slice(0,7);if(!(k in mp))ord.push(k);mp[k]=q;});return ord.map(function(k){return mp[k];});}

function renderViews(){var H=T.viewsHead[LANG];
  var h='<table><thead><tr><th>'+H[0]+'</th><th>'+H[1]+'</th><th>'+H[2]+'</th><th>'+H[3]+'</th><th>'+H[4]+'</th></tr></thead><tbody>';
  VIEWS.forEach(function(v){h+='<tr><td>'+v.h+'</td><td>'+L(v.d)+'</td><td>'+L(v.inst)+'</td><td>'+L(v.tg)+'</td><td>'+L(v.c)+'</td></tr>';});
  h+='</tbody></table>';document.getElementById('viewswrap').innerHTML=h;}

// ---- Flows ----
function renderFlows(){
  document.getElementById('flowsgrid').innerHTML=FLOWS.map(function(f){
    var h='<div class="card"><div class="nm">'+L(f.t)+'</div><div class="blk"><ul>'+f.items.map(function(it){return '<li class="ant"><span class="ar">→</span>'+L(it)+'</li>';}).join('')+'</ul></div>';
    if(f.interp){h+='<div class="blk cat"><div class="t">'+L({zh:"解读",en:"Read"})+'</div><ul><li class="ant"><span class="ar">→</span>'+L(f.interp)+'</li></ul></div>';}
    return h+'</div>';
  }).join('');
}

// ---- Macro / Themes ----
function renderMacro(){document.getElementById('macrobar').innerHTML=MACRO.map(function(m){return '<div class="macro"><div class="k">'+L(m.k)+'</div><div class="v">'+m.v+'</div><div class="d">'+L(m.d)+'</div></div>';}).join('');}
function renderThemes(){document.getElementById('themegrid').innerHTML=THEME.map(function(t){return '<div class="card"><div class="nm">'+L(t.t)+'</div><div class="blk"><ul>'+t.items.map(function(it){return '<li class="ant"><span class="ar">→</span>'+L(it)+'</li>';}).join('')+'</ul></div></div>';}).join('');}

// ---- Calendar ----
function renderCal(){document.getElementById('cal').innerHTML=CAL.map(function(c){return '<div class="titem '+c[1]+'"><div class="date">'+L(c[0])+'</div><div class="body"><div class="ev">'+L(c[2])+' '+L(c[3]).split('/').map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div><div class="why">'+L(c[4])+'</div></div></div>';}).join('');}

// ---- statics + apply ----
function renderStatics(){
  document.getElementById('hsub').innerHTML=L(T.hsub);
  document.getElementById('htime').innerHTML=L(T.htime);
  var nv=T.nav[LANG],ids=["h-ov","h-theme","h-energy","h-metals","h-ferrous","h-ags","h-views","h-flows","h-cal"];
  document.getElementById('nav').innerHTML=nv.map(function(x,i){return '<a href="#'+ids[i]+'">'+x+'</a>';}).join('');
  document.getElementById('callout').className='callout';document.getElementById('callout').innerHTML=L(CALLOUT);
  var st=T.secT;
  document.getElementById('h-ov').textContent=L(st.ov);
  document.getElementById('h-theme').textContent=L(st.theme);
  document.getElementById('h-energy').textContent=L(st.energy);
  document.getElementById('h-metals').textContent=L(st.metals);
  document.getElementById('h-ferrous').textContent=L(st.ferrous);
  document.getElementById('h-ags').textContent=L(st.ags);
  document.getElementById('h-views').textContent=L(st.views);
  document.getElementById('h-flows').textContent=L(st.flows);
  document.getElementById('h-cal').textContent=L(st.cal);
  document.getElementById('arlegend').innerHTML=L(T.legend);
  document.getElementById('viewsnote').innerHTML=L(T.viewsNote);
  document.getElementById('flowsnote').innerHTML=L(T.flowsNote);
  document.getElementById('calnote').innerHTML=L(T.calNote);
  document.getElementById('foot').innerHTML=L(FOOT);
}

function applyLang(){
  document.body.dataset.lang=LANG;
  document.documentElement.lang=(LANG==='zh'?'zh-CN':'en');
  document.getElementById('langbtn').textContent=(LANG==='zh'?'EN':'中文');
  renderStatics();renderMacro();renderThemes();renderOv();renderGran();renderCards();renderViews();renderFlows();renderCal();
}
document.getElementById('langbtn').addEventListener('click',function(){LANG=(LANG==='zh'?'en':'zh');applyLang();});
applyLang();
</script>
</body>
</html>
