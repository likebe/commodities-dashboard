const CALLOUT={zh:"<b>⚡ 隔夜主线 — 白银单日重挫领跌、贵金属在鹰派Warsh联储下加速破位、油价因伊朗60天售油许可创3月新低、铜跌穿$6.3/lb待232裁决：</b> ① <b>白银6/23暴跌逾5%至~$62.6</b>（6/24续破$60至~$60.7、六个月低）领跌大宗：BofA喊2026加息75bp「史上最鹰」、金银比回升至~66；<b>黄金~$4,146（连跌第3-4周）</b>，高盛6/19已下调金价目标至$4,900（来源: <a class='src' href='https://www.cnbc.com/amp/2026/06/23/gold-silver-rate-hike-fears.html' target='_blank'>CNBC</a>）。② <b>WTI~$73.5、Brent~$77.5创近3月新低</b>：6/23美财政部签发60天许可证授权伊朗售油、海峡复航加速（6/19油轮通行20艘），OPEC+维持增产；6/20-21「二次惊吓」已于6/21确认路线图收场（来源: <a class='src' href='https://tradingeconomics.com/commodity/crude-oil' target='_blank'>TE</a>）。③ <b>LME铜~$13,650</b>自纪录高位($14,097,5/13)回落、COMEX跌穿$6.3/lb(5月来最低)：6/30美232铜裁决临近触发「美国囤货结束」获利了结，22年最大缺口＋AI＋Grasberg/Kamoa矿端中断仍托底（来源: <a class='src' href='https://tradingeconomics.com/commodity/copper' target='_blank'>TE</a>）。<b>下一关键＝6/30铜232裁决 & 7/28-29 FOMC</b>（年内加息~86-89%已定价）（来源: <a class='src' href='https://www.federalreserve.gov/newsevents/pressreleases/monetary20260617a.htm' target='_blank'>Fed</a>）。",en:"<b>⚡ Overnight thread — silver leads metals lower, precious metals break down under the hawkish Warsh Fed, oil hits a 3-mo low on Iran's 60-day oil license, copper slides below $6.3/lb into the 232 ruling:</b> (1) <b>Silver crashed >5% to ~$62.6 on 6/23</b> (6/24 broke $60 to ~$60.7, a 6-mo low), leading commodities lower: BofA's 'most hawkish' call sees 75bp of 2026 hikes, gold/silver ratio up to ~66; <b>gold ~$4,146 (3rd-4th straight weekly loss)</b>, Goldman cut its gold target to $4,900 on 6/19 (Src: <a class='src' href='https://www.cnbc.com/amp/2026/06/23/gold-silver-rate-hike-fears.html' target='_blank'>CNBC</a>). (2) <b>WTI ~$73.5, Brent ~$77.5 at near-3-mo lows</b>: a 6/23 US Treasury 60-day Iran-oil license + accelerating Hormuz reopening (20 tankers on 6/19), OPEC+ keeps adding; the 6/20-21 'second scare' resolved into a confirmed roadmap on 6/21 (Src: <a class='src' href='https://tradingeconomics.com/commodity/crude-oil' target='_blank'>TE</a>). (3) <b>LME copper ~$13,650</b> off the record ($14,097, 5/13), COMEX below $6.3/lb (lowest since May): the 6/30 Section 232 ruling sparks 'US restocking ends' profit-taking, but the biggest deficit in 22 yrs + AI + Grasberg/Kamoa mine disruptions put in a floor (Src: <a class='src' href='https://tradingeconomics.com/commodity/copper' target='_blank'>TE</a>). <b>Next keys = the 6/30 copper 232 ruling & the 7/28-29 FOMC</b> (a 2026 hike ~86-89% priced) (Src: <a class='src' href='https://www.federalreserve.gov/newsevents/pressreleases/monetary20260617a.htm' target='_blank'>Fed</a>)."};

function pdate(lbl){var y;var ym=lbl.match(/^(\d+)\/(\d+)$/);if(ym){var a=+ym[1],b=+ym[2];if(a>12){return new Date(2000+a,b-1,15);}return new Date(2026,a-1,b);}var mm=lbl.match(/^(\d+)月(初|中|末|均)?$/);if(mm){var mo=+mm[1];var dd=mm[2]==="初"?5:(mm[2]==="末"?25:15);return new Date(2026,mo-1,dd);}return new Date(2026,0,1);}
function isod(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function clab(s){var p=s.split("-");if(GRAN==="M")return s.slice(2,7).replace("-","/");return (p[0]==="2025"?"25/":"")+(+p[1])+"/"+(+p[2]);}
function hsh(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return (h>>>0)||1;}
function genDaily(d){if(d._daily)return d._daily;var A=d.trend.map(function(q){return [pdate(q[0]).getTime(),q[1]];}).sort(function(a,b){return a[0]-b[0];});var seed=hsh(d.nmEn);function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}var DAY=86400000,out=[],i=0;for(var t=A[0][0];t<=A[A.length-1][0];t+=DAY){var dt=new Date(t);var w=dt.getDay();if(w===0||w===6)continue;while(i<A.length-2&&A[i+1][0]<t)i++;var a=A[i],b=A[i+1]||A[i];var fr=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):0;if(fr<0)fr=0;if(fr>1)fr=1;var base=a[1]+(b[1]-a[1])*fr;var v=base*(1+(rnd()-0.5)*0.012);var dec=base>1000?0:(base>10?2:3);out.push([isod(dt),+v.toFixed(dec)]);}if(out.length){var la=A[A.length-1];out[out.length-1]=[isod(new Date(la[0])),la[1]];}d._daily=out;return out;}
function resample(daily,g){if(g==="D")return daily;if(g==="W"){var r=[];for(var i=0;i<daily.length;i+=5)r.push(daily[i]);if(r.length&&r[r.length-1]!==daily[daily.length-1])r.push(daily[daily.length-1]);return r;}var mp={},ord=[];daily.forEach(function(q){var k=q[0].slice(0,7);if(!(k in mp))ord.push(k);mp[k]=q;});return ord.map(function(k){return mp[k];});}

function liArrow(x){var dir='n',t=x;var m=x.match(/^\[(u|d|n)\]/);if(m){dir=m[1];t=x.slice(3);}var sym=dir==='u'?'▲':(dir==='d'?'▼':'→');var cls=dir==='u'?'aup':(dir==='d'?'adn':'ant');return '<li class="'+cls+'"><span class="ar">'+sym+'</span>'+t+'</li>';}
function sanit(s){return s.replace(/[^A-Za-z0-9]+/g,'_');}
function trendXlsx(d){
  var header=L({zh:["日期","价格"],en:["Date","Price"]});
  var rows=resample(genDaily(d),GRAN).map(function(p){return [p[0],p[1]];});
  var nm=LANG==='zh'?d.nm:d.nmEn;var fn="trend_"+sanit(d.nmEn)+"_"+GRAN+"_2026-06-24";
  if(window.XLSX){var ws=XLSX.utils.aoa_to_sheet([[nm+" ("+d.en+")"],header].concat(rows));ws['!cols']=[{wch:12},{wch:12}];var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"trend");XLSX.writeFile(wb,fn+".xlsx");}
  else{var csv=String.fromCharCode(0xFEFF)+header.join(",")+"\n";rows.forEach(function(r){csv+=r.join(",")+"\n";});var b=new Blob([csv],{type:"text/csv;charset=utf-8;"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn+".csv";document.body.appendChild(a);a.click();a.remove();}
}

// ---- Overview ----
var FK=["all","energy","metals","ferrous","ags"];
var ovFilter='all',ovSortKey=null,ovSortDir=-1;
function curRows(){var r=DATA.filter(function(x){return ovFilter==='all'||x.sec===ovFilter;});if(ovSortKey){r=r.slice().sort(function(a,b){return ((a[ovSortKey]==null?-1e9:a[ovSortKey])-(b[ovSortKey]==null?-1e9:b[ovSortKey]))*ovSortDir;});}return r;}
function renderOv(){
  var ft=T.filt[LANG];
  document.getElementById('ovfilters').innerHTML=FK.map(function(k,i){return '<button class="fbtn '+(ovFilter===k?'on':'')+'" data-f="'+k+'">'+ft[i]+'</button>';}).join('');
  document.getElementById('ovdl').textContent=L(T.dlOv);
  var H=T.ovHead[LANG];
  function ind(k){return ovSortKey===k?'<span class="ind">'+(ovSortDir<0?'▼':'▲')+'</span>':'';}
  var h='<table><thead><tr><th>'+H[0]+'</th><th>'+H[1]+'</th><th>'+H[2]+'</th><th>'+H[3]+'</th><th class="sortable" data-s="w">'+H[4]+ind('w')+'</th><th class="sortable" data-s="m">'+H[5]+ind('m')+'</th><th class="sortable" data-s="y">'+H[6]+ind('y')+'</th><th>'+H[7]+'</th></tr></thead><tbody>';
  curRows().forEach(function(d){var nm=LANG==='zh'?d.nm:d.nmEn;var px=LANG==='zh'?d.px:d.pxEn;
    h+='<tr><td><span class="tag">'+L(SECNAME[d.sec])+'</span></td><td><b>'+nm+'</b> <span style="color:var(--muted);font-size:11px">'+d.en+'</span></td><td style="color:var(--gold);font-weight:700">'+px+'</td><td style="color:var(--muted)">'+d.asof+'</td><td>'+pct(d.w)+'</td><td>'+pct(d.m)+'</td><td>'+pct(d.y)+' <span style="color:var(--muted);font-size:10px">'+d.yl+'</span></td><td style="color:#c9d1d9;font-size:12px">'+L(d.st)+'</td></tr>';});
  h+='</tbody></table>';
  document.getElementById('ovtable').innerHTML=h;
  document.querySelectorAll('#ovtable th.sortable').forEach(function(th){th.onclick=function(){var k=th.dataset.s;if(ovSortKey===k){ovSortDir=-ovSortDir;}else{ovSortKey=k;ovSortDir=-1;}renderOv();};});
}
document.getElementById('ovfilters').addEventListener('click',function(e){var b=e.target.closest('.fbtn');if(!b)return;ovFilter=b.dataset.f;renderOv();});
document.getElementById('granctl').addEventListener('click',function(e){var b=e.target.closest('.fbtn');if(!b)return;GRAN=b.dataset.g;renderGran();renderCards();});
function exportOv(){
  var DSRC={
    "WTI Crude":["TradingEconomics (WTI front-month)","https://tradingeconomics.com/commodity/crude-oil"],
    "Brent Crude":["TradingEconomics (ICE Brent)","https://tradingeconomics.com/commodity/brent-crude-oil"],
    "US Nat Gas":["TradingEconomics / EIA (Henry Hub)","https://tradingeconomics.com/commodity/natural-gas"],
    "Europe Gas (TTF)":["TradingEconomics (ICE Dutch TTF)","https://tradingeconomics.com/commodity/eu-natural-gas"],
    "Gold":["TradingEconomics / Kitco (spot)","https://tradingeconomics.com/commodity/gold"],
    "Silver":["Kitco (spot)","https://www.kitco.com/charts/silver"],
    "LME Copper":["TradingEconomics / LME (3M)","https://tradingeconomics.com/commodity/copper"]
  };
  var rows=DATA;var dt="2026-06-24";
  var dh=L({zh:["日期","价格"],en:["Date","Price"]});
  if(window.XLSX){
    var wb=XLSX.utils.book_new();
    var H=T.ovHead[LANG];
    var ohdr=[H[0],H[1],L({zh:"英文/合约",en:"Contract"}),H[2],H[3],"1W%","1M%","YTD/1Y%",L({zh:"区间",en:"Window"}),H[7],L({zh:"数据来源",en:"Data source"}),L({zh:"来源链接",en:"Source URL"})];
    var obody=rows.map(function(r){var s=DSRC[r.nmEn]||["",""];return [L(SECNAME[r.sec]),LANG==='zh'?r.nm:r.nmEn,r.en,LANG==='zh'?r.px:r.pxEn,r.asof,r.w,r.m,r.y,r.yl,L(r.st),s[0],s[1]];});
    var ows=XLSX.utils.aoa_to_sheet([ohdr].concat(obody));ows['!cols']=[{wch:8},{wch:16},{wch:20},{wch:14},{wch:7},{wch:8},{wch:8},{wch:9},{wch:9},{wch:34},{wch:24},{wch:48}];
    XLSX.utils.book_append_sheet(wb,ows,L({zh:"总览",en:"Overview"}));
    rows.forEach(function(d){
      var s=DSRC[d.nmEn]||["",""];var nm=LANG==='zh'?d.nm:d.nmEn;
      var top=[[nm+" ("+d.en+")"],[L({zh:"数据来源",en:"Data source"})+": "+s[0]],[L({zh:"来源链接",en:"Source URL"})+": "+s[1]],[L({zh:"频率：日度（由锚点插值重构，非真实日收盘价，仅供看势）",en:"Frequency: daily (interpolated from anchors, not actual daily closes)"})],dh];
      var rws=genDaily(d).map(function(p){return [p[0],p[1]];});
      var ws=XLSX.utils.aoa_to_sheet(top.concat(rws));ws['!cols']=[{wch:12},{wch:12}];
      XLSX.utils.book_append_sheet(wb,ws,sanit(d.nmEn).slice(0,28));
    });
    var shdr=L({zh:["品种","合约","数据来源","来源链接"],en:["Instrument","Contract","Data source","Source URL"]});
    var sbody=rows.map(function(r){var s=DSRC[r.nmEn]||["",""];return [LANG==='zh'?r.nm:r.nmEn,r.en,s[0],s[1]];});
    sbody.push(["—","—",L({zh:"说明",en:"Note"}),L({zh:"价格为近月/现货近似值(~)，截至6/23；走势为锚点插值重构、非真实日收盘价；卡片内各条结论另附独立来源链接，可点击溯源",en:"Prices are approximate front-month/spot (~) as of 6/23; trends are interpolated from anchors (not actual closes); each card line carries its own clickable source link"})]);
    var sws=XLSX.utils.aoa_to_sheet([shdr].concat(sbody));sws['!cols']=[{wch:16},{wch:18},{wch:24},{wch:48}];
    XLSX.utils.book_append_sheet(wb,sws,L({zh:"数据来源",en:"Sources"}));
    XLSX.writeFile(wb,"commodities_all_daily_"+dt+".xlsx");
  }else{
    var hdr=[L({zh:"板块",en:"Sector"}),L({zh:"品种",en:"Instrument"}),L({zh:"合约",en:"Contract"}),L({zh:"日期",en:"Date"}),L({zh:"价格",en:"Price"}),L({zh:"数据来源",en:"Data source"}),L({zh:"来源链接",en:"Source URL"})];
    var csv=String.fromCharCode(0xFEFF)+hdr.join(",")+"\n";
    rows.forEach(function(d){var s=DSRC[d.nmEn]||["",""];genDaily(d).forEach(function(p){csv+=[L(SECNAME[d.sec]),LANG==='zh'?d.nm:d.nmEn,d.en,p[0],p[1],s[0],s[1]].map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",")+"\n";});});
    var b=new Blob([csv],{type:"text/csv;charset=utf-8;"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="commodities_all_daily_"+dt+".csv";document.body.appendChild(a);a.click();a.remove();
  }
}
document.getElementById('ovdl').addEventListener('click',exportOv);

// ---- Cards ----
function card(d){
  var nm=LANG==='zh'?d.nm:d.nmEn;var px=LANG==='zh'?d.px:d.pxEn;
  var drv=LANG==='zh'?d.drv:d.drvEn;var news=LANG==='zh'?d.news:d.newsEn;var cat=LANG==='zh'?d.cat:d.catEn;
  var el=document.createElement('div');el.className='card';
  el.innerHTML='<div class="head"><div class="nm">'+nm+'<span class="en">'+d.en+'</span></div><div class="px">'+px+' <small>'+L(T.asof)+d.asof+'</small></div></div>'
   +'<div class="chgrow"><span><b>'+L(T.wk)+'</b> '+pct(d.w)+'</span><span><b>'+L(T.mo)+'</b> '+pct(d.m)+'</span><span><b>'+d.yl+'</b> '+pct(d.y)+'</span></div>'
   +'<div class="cardbar"><button class="minidl">'+L(T.dlData)+'</button></div>'
   +'<div class="spark"><canvas></canvas></div>'
   +'<div class="blk"><div class="t">'+L(T.drv)+'</div><ul>'+drv.map(liArrow).join('')+'</ul></div>'
   +'<div class="blk"><div class="t">'+L(T.nws)+'</div><ul>'+news.map(liArrow).join('')+'</ul></div>'
   +'<div class="blk cat"><div class="t">'+L(T.cat)+'</div><ul>'+cat.map(liArrow).join('')+'</ul></div>';
  document.getElementById('sec-'+d.sec).appendChild(el);
  el.querySelector('.minidl').onclick=function(){trendXlsx(d);};
  var series=resample(genDaily(d),GRAN);var labels=series.map(function(p){return clab(p[0]);});var vals=series.map(function(p){return p[1];});var col=vals[vals.length-1]>=vals[0]?C.up:C.down;var pr=GRAN==="D"?0:2;
  new Chart(el.querySelector('canvas'),{type:'line',data:{labels:labels,datasets:[{data:vals,borderColor:col,backgroundColor:col+'22',fill:true,tension:GRAN==='D'?.15:.3,pointRadius:pr,pointBackgroundColor:col,borderWidth:GRAN==='D'?1.5:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{ticks:{color:C.muted,font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:7},grid:{display:false}},y:{ticks:{color:C.muted,font:{size:9}},grid:{color:C.grid}}}}});
}
function renderCards(){["energy","metals","ferrous","ags"].forEach(function(s){document.getElementById('sec-'+s).innerHTML='';});DATA.forEach(card);}

// ---- Prune empty sections (sections with no included instruments are fully hidden) ----
function pruneEmptySections(){
  ["energy","metals","ferrous","ags"].forEach(function(s){
    var grid=document.getElementById('sec-'+s);if(!grid)return;
    var empty=grid.children.length===0;var disp=empty?'none':'';
    grid.style.display=disp;
    var h=document.getElementById('h-'+s);if(h)h.style.display=disp;
    var nav=document.querySelector('#nav a[href="#h-'+s+'"]');if(nav)nav.style.display=disp;
    var fb=document.querySelector('#ovfilters .fbtn[data-f="'+s+'"]');if(fb)fb.style.display=disp;
    if(s==="energy"){var al=document.getElementById('arlegend');if(al)al.style.display=disp;}
  });
}
function applyLang(){
  document.body.dataset.lang=LANG;
  document.documentElement.lang=(LANG==='zh'?'zh-CN':'en');
  document.getElementById('langbtn').textContent=(LANG==='zh'?'EN':'中文');
  renderStatics();renderMacro();renderThemes();renderOv();renderGran();renderCards();renderViews();renderFlows();renderCal();
  pruneEmptySections();
}
// ---- Live data: pull real daily closes from data.json (built daily by GitHub Action); fall back to baked values ----
function mergeLiveData(cb){
  if(!window.fetch){cb();return;}
  fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    var _age=(j&&j.updated)?(Date.now()-new Date(j.updated).getTime())/86400000:999;if(j&&j.instruments&&_age<=4){var n=0,asof='';
      DATA.forEach(function(d){var o=j.instruments[d.nmEn];if(!o)return;
        if(o.px){d.px=o.px;d.pxEn=o.pxEn||o.px;}
        if(o.asof){d.asof=o.asof;asof=o.asof;}
        if(typeof o.w==='number')d.w=o.w;
        if(typeof o.m==='number')d.m=o.m;
        if(typeof o.y==='number')d.y=o.y;
        if(o.yl)d.yl=o.yl;
        if(o.series&&o.series.length){d._daily=o.series.map(function(p){return [p[0],p[1]];});}
        d._live=true;n++;});
      if(n)window.__live={n:n,asof:asof,updated:j.updated};
    }
    cb();
  }).catch(function(){cb();});
}
function boot(){
  applyLang();
  var v=window.__live;
  if(v&&v.n){var t=document.getElementById('htime');if(t){t.innerHTML+=(LANG==='zh'
    ?' · <b style="color:var(--up)">● 实时</b> '+v.n+' 品种价格/走势取自 FRED/Stooq（截至 '+v.asof+'）'
    :' · <b style="color:var(--up)">● Live</b> '+v.n+' instruments via FRED/Stooq (as of '+v.asof+')');}}
}
document.getElementById('langbtn').addEventListener('click',function(){LANG=(LANG==='zh'?'en':'zh');boot();});
mergeLiveData(boot);
